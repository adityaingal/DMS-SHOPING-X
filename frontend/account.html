<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account — ShopX</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f46e5'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='Segoe UI' font-weight='bold'>X</text></svg>" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/splash.css" />
  <script src="/js/splash.js"></script>
</head>
<body data-page="account">
  <header id="site-header"></header>

  <main>
    <div class="container">
      <div class="page-head">
        <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="/index.html">Home</a><span>My account</span></nav>
        <h1>My account</h1>
      </div>

      <div id="accountGate" class="empty-state hidden">
        <div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
        <h3>Sign in to view your account</h3>
        <p>You need to be signed in to manage your profile, addresses and orders.</p>
        <a class="btn" href="/login.html?returnTo=%2Faccount.html">Sign in</a>
      </div>

      <div class="account-layout hidden" id="accountLayout">
        <aside class="account-nav">
          <div class="who"><b id="whoName">—</b><span id="whoEmail">—</span></div>
          <button class="active" data-panel="profile">Profile details</button>
          <button data-panel="password">Change password</button>
          <button data-panel="addresses">Saved addresses</button>
          <a href="/orders.html" style="display:flex;gap:.6rem;align-items:center;padding:.75rem 1rem;font-size:.92rem;font-weight:600;color:var(--text-2);border-left:3px solid transparent">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/></svg>
            Order history
          </a>
          <a href="/wishlist.html" style="display:flex;gap:.6rem;align-items:center;padding:.75rem 1rem;font-size:.92rem;font-weight:600;color:var(--text-2);border-left:3px solid transparent">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
            Wishlist
          </a>
        </aside>

        <section>
          <div class="stat-mini" id="accountStats">
            <div><b>—</b><span>Orders</span></div>
            <div><b>—</b><span>Wishlist items</span></div>
            <div><b>—</b><span>Member since</span></div>
          </div>

          <div class="tab-panel active" id="panel-profile">
            <div class="panel">
              <h3>Profile details</h3>
              <div class="alert alert-success hidden" id="profileOk"></div>
              <form id="profileForm">
                <div class="row">
                  <div class="field"><label for="pName">Full name</label><input class="input" id="pName" name="name" required /></div>
                  <div class="field"><label for="pPhone">Phone</label><input class="input" id="pPhone" name="phone" /></div>
                </div>
                <div class="field"><label for="pEmail">Email address</label><input class="input" type="email" id="pEmail" name="email" required /></div>
                <button class="btn" type="submit">Save changes</button>
              </form>
            </div>

            <div class="panel" style="margin-top:1rem">
              <h3>Sign-in method</h3>
              <div id="signInMethod"><p class="muted" style="margin:0">Loading…</p></div>
            </div>
          </div>

          <div class="tab-panel" id="panel-password">
            <div class="panel">
              <h3>Change password</h3>
              <div class="alert alert-success hidden" id="passwordOk"></div>
              <form id="passwordForm">
                <div class="field"><label for="curPass">Current password</label><input class="input" type="password" id="curPass" name="currentPassword" autocomplete="current-password" required /></div>
                <div class="row">
                  <div class="field"><label for="newPass">New password</label><input class="input" type="password" id="newPass" name="newPassword" autocomplete="new-password" required /></div>
                  <div class="field"><label for="confPass">Confirm new password</label><input class="input" type="password" id="confPass" autocomplete="new-password" required /></div>
                </div>
                <button class="btn" type="submit">Update password</button>
              </form>
            </div>
          </div>

          <div class="tab-panel" id="panel-addresses">
            <div class="panel">
              <div class="section-head" style="margin-bottom:1rem">
                <h3 style="margin:0">Saved addresses</h3>
                <button class="btn btn-sm" id="addAddressBtn" type="button">+ Add address</button>
              </div>
              <div id="addressList"></div>

              <form id="addressForm" class="hidden" style="border-top:1px solid var(--border);padding-top:1rem;margin-top:1rem">
                <input type="hidden" id="addrId" />
                <div class="row">
                  <div class="field"><label>Label</label><input class="input" id="aLabel" placeholder="Home / Work" /></div>
                  <div class="field"><label>Full name *</label><input class="input" id="aName" required /></div>
                  <div class="field"><label>Phone *</label><input class="input" id="aPhone" required /></div>
                </div>
                <div class="field"><label>Address line 1 *</label><input class="input" id="aLine1" required /></div>
                <div class="field"><label>Address line 2</label><input class="input" id="aLine2" /></div>
                <div class="row">
                  <div class="field"><label>City *</label><input class="input" id="aCity" required /></div>
                  <div class="field"><label>State *</label><input class="input" id="aState" required /></div>
                  <div class="field"><label>Postal code *</label><input class="input" id="aPostal" required /></div>
                </div>
                <label class="checkbox-line" style="margin-bottom:1rem"><input type="checkbox" id="aDefault" /> Set as default address</label>
                <div style="display:flex;gap:.6rem">
                  <button class="btn" type="submit">Save address</button>
                  <button class="btn btn-outline" type="button" id="cancelAddress">Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/account.js"></script>
  <script src="/js/google-auth.js"></script>
</body>
</html>

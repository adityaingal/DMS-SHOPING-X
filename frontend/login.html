<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — ShopX</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f46e5'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='Segoe UI' font-weight='bold'>X</text></svg>" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/splash.css" />
  <script src="/js/splash.js"></script>
</head>
<body data-page="login">
  <header id="site-header"></header>

  <main>
    <div class="auth-wrap">
      <div class="auth-card">
        <a class="logo" href="/index.html"><span class="logo-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span>Shop<span>X</span></a>
        <h1>Welcome back</h1>
        <p class="auth-sub">Sign in to access your cart, orders and wishlist</p>

        <div class="alert alert-error hidden" id="loginAlert"></div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input class="input" type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input class="input" type="password" id="password" name="password" autocomplete="current-password" placeholder="Your password" required />
          </div>
          <button class="btn btn-lg btn-block" type="submit" id="loginBtn">Sign in</button>
        </form>

        <div class="auth-divider" id="authDivider"><span>OR</span></div>

        <div class="google-auth" id="googleAuth">
          <button type="button" class="btn btn-google btn-lg btn-block" id="googleBtn">
            <svg class="g-logo" viewBox="0 0 48 48" width="18" height="18" aria-hidden="true" focusable="false"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            <span class="g-label">Continue with Google</span>
          </button>
          <div class="gis-slot hidden" id="gisSlot"></div>
          <p class="google-hint hidden" id="googleHint"></p>
          <p class="google-status" id="googleStatus" role="status" aria-live="polite"></p>
        </div>

        <p class="auth-alt">New to ShopX? <a href="/register.html"><b>Create an account</b></a></p>

        <div class="alert alert-info" style="margin:1.2rem 0 0">
          <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span>
          <span><b>Demo accounts</b><br />Customer: customer@shopx.com / Customer@123<br />Admin: admin@shopx.com / Admin@123</span>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/auth-pages.js"></script>
  <script src="/js/google-auth.js"></script>
</body>
</html>

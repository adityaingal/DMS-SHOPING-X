<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product — ShopX</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f46e5'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='Segoe UI' font-weight='bold'>X</text></svg>" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/splash.css" />
  <script src="/js/splash.js"></script>
</head>
<body data-page="product">
  <header id="site-header"></header>

  <main>
    <div class="container">
      <div class="page-head">
        <nav class="breadcrumbs" aria-label="Breadcrumb" id="crumbs"></nav>
      </div>

      <div id="pdpLoading" class="loading-overlay">
        <div>
          <span class="spinner dark" style="width:34px;height:34px"></span>
          <p class="muted" style="margin-top:.8rem">Loading product…</p>
        </div>
      </div>

      <div id="pdpError" class="empty-state hidden">
        <div class="ic">?</div>
        <h3>Product not found</h3>
        <p id="pdpErrorMsg">This product may have been removed or the link is incorrect.</p>
        <a class="btn" href="/products.html">Back to shopping</a>
      </div>

      <div id="pdpContent" class="hidden">
        <section class="pdp">
          <div class="pdp-gallery">
            <div class="main-img"><img id="mainImage" src="" alt="" /></div>
            <div class="pdp-thumbs" id="thumbs"></div>
          </div>
          <div class="pdp-info">
            <span class="product-brand" id="pBrand"></span>
            <h1 id="pName"></h1>
            <div class="pdp-meta" id="pMeta"></div>
            <div class="pdp-price" id="pPrice"></div>
            <div id="stockLine" class="info-line"></div>
            <p class="pdp-desc" id="pDesc" style="border-top:none;padding-top:0;margin-top:.6rem"></p>

            <div class="pdp-actions">
              <div class="qty-control">
                <button type="button" id="qtyMinus" aria-label="Decrease quantity">−</button>
                <input type="number" id="qtyInput" value="1" min="1" max="99" aria-label="Quantity" />
                <button type="button" id="qtyPlus" aria-label="Increase quantity">+</button>
              </div>
              <button class="btn btn-lg" id="addToCartBtn" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
                Add to cart
              </button>
              <button class="btn btn-outline btn-lg" id="wishBtn" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                Wishlist
              </button>
            </div>

            <div style="margin-top:1.1rem">
              <div class="info-line"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg> Free shipping on orders above ₹999</div>
              <div class="info-line"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> 7-day easy replacement policy</div>
              <div class="info-line"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Secure checkout with COD &amp; sandbox payment</div>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="tabs" role="tablist">
            <button class="tab-btn active" data-tab="description" role="tab">Description</button>
            <button class="tab-btn" data-tab="reviews" role="tab">Reviews <span id="reviewTabCount" class="muted"></span></button>
          </div>

          <div class="tab-panel active" id="tab-description">
            <div class="panel">
              <p id="fullDescription" style="white-space:pre-line;margin:0"></p>
            </div>
          </div>

          <div class="tab-panel" id="tab-reviews">
            <div class="panel">
              <div class="review-summary" id="reviewSummary"></div>
              <div id="reviewFormWrap"></div>
              <div class="review-list" id="reviewList"></div>
              <div class="load-more-wrap" id="reviewMore"></div>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="section-head"><div><h2>Related products</h2><p>More from this category</p></div></div>
          <div class="product-grid" id="relatedGrid"></div>
        </section>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/product-page.js"></script>
</body>
</html>

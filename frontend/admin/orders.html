<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Orders — ShopX Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f46e5'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='Segoe UI' font-weight='bold'>X</text></svg>" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/splash.css" />
  <script src="/js/splash.js"></script>
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body data-page="admin" data-admin-page="orders">
  <div class="admin-body">
    <aside class="admin-sidebar" id="adminSidebar"></aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div style="display:flex;gap:.7rem;align-items:center">
          <button class="btn-icon admin-menu-btn" id="adminMenuBtn" aria-label="Open menu">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          </button>
          <div>
            <h1>Orders</h1>
            <div class="sub">Track shipments, update statuses and handle payments</div>
          </div>
        </div>
      </header>

      <main class="admin-content">
        <div class="toolbar">
          <input class="input grow" type="search" id="orderSearch" placeholder="Search order number, customer name or email…" aria-label="Search orders" />
          <select class="select" id="statusFilter" aria-label="Filter by order status">
            <option value="">All statuses</option>
            <option>Pending</option><option>Confirmed</option><option>Processing</option>
            <option>Shipped</option><option>Delivered</option><option>Cancelled</option>
          </select>
          <select class="select" id="paymentFilter" aria-label="Filter by payment status">
            <option value="">Any payment</option>
            <option value="pending">Pending</option>
            <option value="paid">Paid</option>
            <option value="refunded">Refunded</option>
            <option value="failed">Failed</option>
          </select>
        </div>

        <div class="card">
          <div class="card-body flush">
            <div class="table-wrap">
              <table class="data" id="ordersTable">
                <thead>
                  <tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th></th></tr>
                </thead>
                <tbody>
                  <tr><td colspan="7" class="muted" style="text-align:center;padding:2rem">Loading orders…</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="pagination" id="orderPager"></div>
      </main>
    </div>
  </div>

  <div id="orderModal"></div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/admin-orders.js"></script>
</body>
</html>

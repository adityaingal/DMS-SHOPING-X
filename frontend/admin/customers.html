<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Customers — ShopX Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f46e5'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='Segoe UI' font-weight='bold'>X</text></svg>" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/splash.css" />
  <script src="/js/splash.js"></script>
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body data-page="admin" data-admin-page="customers">
  <div class="admin-body">
    <aside class="admin-sidebar" id="adminSidebar"></aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div style="display:flex;gap:.7rem;align-items:center">
          <button class="btn-icon admin-menu-btn" id="adminMenuBtn" aria-label="Open menu">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          </button>
          <div>
            <h1>Customers</h1>
            <div class="sub">Registered shoppers and their order activity</div>
          </div>
        </div>
      </header>

      <main class="admin-content">
        <div class="toolbar">
          <input class="input grow" type="search" id="customerSearch" placeholder="Search by name, email or phone…" aria-label="Search customers" />
        </div>

        <div class="card">
          <div class="card-body flush">
            <div class="table-wrap">
              <table class="data" id="customersTable">
                <thead>
                  <tr><th>Customer</th><th>Phone</th><th>Joined</th><th>Orders</th><th>Total spent</th><th></th></tr>
                </thead>
                <tbody>
                  <tr><td colspan="6" class="muted" style="text-align:center;padding:2rem">Loading customers…</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="pagination" id="custPager"></div>
      </main>
    </div>
  </div>

  <div id="customerModal"></div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/admin-customers.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders — ShopX</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f46e5'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='Segoe UI' font-weight='bold'>X</text></svg>" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/splash.css" />
  <script src="/js/splash.js"></script>
</head>
<body data-page="orders">
  <header id="site-header"></header>

  <main>
    <div class="container">
      <div class="page-head">
        <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="/index.html">Home</a><span>My orders</span></nav>
        <div class="section-head">
          <div>
            <h1 id="ordersTitle">My orders</h1>
            <p class="muted" id="ordersSubtitle">Track, manage and review your purchases</p>
          </div>
        </div>
      </div>

      <div id="ordersGate" class="empty-state hidden">
        <div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/></svg></div>
        <h3>Sign in to see your orders</h3>
        <p>Log in to view order history, track deliveries and manage returns.</p>
        <a class="btn" href="/login.html?returnTo=%2Forders.html">Sign in</a>
      </div>

      <div id="placedBanner" class="alert alert-success hidden"></div>

      <div id="ordersList" class="hidden" style="padding-bottom:2rem"></div>
      <div id="ordersLoading" class="loading-overlay hidden">
        <div><span class="spinner dark" style="width:32px;height:32px"></span><p class="muted" style="margin-top:.7rem">Loading orders…</p></div>
      </div>
      <div id="ordersEmpty" class="empty-state hidden">
        <div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 16v-2a4 4 0 0 0-4-4H6"/><path d="M21 16v-2a4 4 0 0 0-4-4H6"/></svg></div>
        <h3>No orders yet</h3>
        <p>When you place your first order, it will appear here with live status updates.</p>
        <a class="btn" href="/products.html">Start shopping</a>
      </div>

      <div id="orderDetail" class="hidden" style="padding-bottom:2.5rem"></div>
      <div id="ordersPager" class="pagination hidden"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/orders.js"></script>
</body>
</html>
